# How MoveIt sends a planned motion to the robot: as a "follow joint trajectory" action,
# one per arm. The actions are offered by baxter_interface's joint trajectory action
# server (docs/trajectory-action.md), which the launch file starts.
#
# MoveIt asks for <controller name>/<action_ns>. The launch file maps those two names to
# where the server offers the actions: robot/limb/left/follow_joint_trajectory and
# robot/limb/right/follow_joint_trajectory.
moveit_controller_manager: moveit_simple_controller_manager/MoveItSimpleControllerManager

moveit_simple_controller_manager:
  controller_names:
    - left_arm_controller
    - right_arm_controller

  left_arm_controller:
    type: FollowJointTrajectory
    action_ns: follow_joint_trajectory
    default: true
    joints: [left_s0, left_s1, left_e0, left_e1, left_w0, left_w1, left_w2]

  right_arm_controller:
    type: FollowJointTrajectory
    action_ns: follow_joint_trajectory
    default: true
    joints: [right_s0, right_s1, right_e0, right_e1, right_w0, right_w1, right_w2]
