# ros1_bridge mapping rules, generated by scripts/port_msgs_to_ros2.py.
# One rule per message/service whose field names differ between ROS 1 and 2.
# A rule lists ALL fields: fields not listed are not copied by the bridge.
-
  ros1_package_name: 'baxter_maintenance_msgs'
  ros1_message_name: 'CalibrateArmData'
  ros2_package_name: 'baxter_maintenance_msgs'
  ros2_message_name: 'CalibrateArmData'
  fields_1_to_2:
    suppressWriteToFile: 'suppress_write_to_file'
-
  ros1_package_name: 'baxter_maintenance_msgs'
  ros1_message_name: 'CalibrateArmEnable'
  ros2_package_name: 'baxter_maintenance_msgs'
  ros2_message_name: 'CalibrateArmEnable'
  fields_1_to_2:
    isEnabled: 'is_enabled'
    uid: 'uid'
    data: 'data'
-
  ros1_package_name: 'baxter_maintenance_msgs'
  ros1_message_name: 'TareData'
  ros2_package_name: 'baxter_maintenance_msgs'
  ros2_message_name: 'TareData'
  fields_1_to_2:
    tuneGravitySpring: 'tune_gravity_spring'
-
  ros1_package_name: 'baxter_maintenance_msgs'
  ros1_message_name: 'TareEnable'
  ros2_package_name: 'baxter_maintenance_msgs'
  ros2_message_name: 'TareEnable'
  fields_1_to_2:
    isEnabled: 'is_enabled'
    uid: 'uid'
    data: 'data'
